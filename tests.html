<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Puzzle - Automated Test Suite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.test-container{max-width:900px;margin:0 auto}
h1{color:#667eea;text-align:center;margin-bottom:5px;font-size:1.5em}
.subtitle{text-align:center;color:#a0a0b8;margin-bottom:25px;font-size:0.9em}
#testResults{margin-bottom:20px}
.test-group{margin-bottom:12px;padding:14px;background:#16213e;border-radius:10px;border-left:4px solid #444}
.test-group.pass{border-left-color:#00e676}
.test-group.fail{border-left-color:#ff5252}
.test-group.skip{border-left-color:#ffd600}
.test-name{font-weight:600;margin-bottom:4px;font-size:0.95em}
.test-group.pass .test-name{color:#00e676}
.test-group.fail .test-name{color:#ff5252}
.test-group.skip .test-name{color:#ffd600}
.test-detail{color:#a0a0b8;font-size:0.82em;line-height:1.4}
.test-detail code{background:#0d1321;padding:1px 5px;border-radius:3px;color:#8fa4ff}
.test-detail .val{color:#8fa4ff;font-weight:600}
.summary{background:#16213e;border-radius:10px;padding:18px;text-align:center;font-size:1.1em}
.summary .total{color:#a0a0b8}
.summary .pass-count{color:#00e676;font-weight:700}
.summary .fail-count{color:#ff5252;font-weight:700}
.summary .skip-count{color:#ffd600}
.controls{text-align:center;margin-bottom:20px}
button.run-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 28px;font-size:1em;border-radius:25px;cursor:pointer;font-weight:600;transition:transform 0.2s}
button.run-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,0.4)}
button.run-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
#testOutput{font-family:monospace;font-size:0.75em;color:#a0a0b8;max-height:200px;overflow-y:auto;background:#0d1321;padding:10px;border-radius:8px;margin-bottom:15px;display:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="test-container">
<h1>🧩 Slide Puzzle — Automated Test Suite</h1>
<p class="subtitle">Tests against https://patisonkindle-commits.github.io/slide-puzzle-game/</p>
<div class="controls">
<button class="run-btn" id="runBtn" onclick="runAllTests()">▶ Run All Tests</button>
</div>
<div id="testOutput"></div>
<div id="testResults"></div>
<div class="summary hidden" id="summary"></div>
</div>

<!-- Load the game -->
<script src="https://patisonkindle-commits.github.io/slide-puzzle-game/"></script>

<script>
// ═══════════════════════════════════════════════════════════
// TEST FRAMEWORK
// ═══════════════════════════════════════════════════════════
let testResults = [];
let testLog = [];

function log(msg) {
  testLog.push(msg);
  const el = document.getElementById('testOutput');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function runAllTests() {
  testResults = [];
  testLog = [];
  const output = document.getElementById('testOutput');
  output.style.display = 'block';
  output.textContent = '';
  document.getElementById('runBtn').disabled = true;

  // Small delay for any remaining scripts to finish
  setTimeout(() => {
    runTests();
    document.getElementById('runBtn').disabled = false;
  }, 500);
}

function runTests() {
  try {
    t001(); t002(); t003(); t004(); t005();
    t101(); t102(); t103(); t104(); t105();
    t201(); t202(); t203(); t204();
    t301(); t302(); t303(); t304(); t305();
    t401(); t402(); t403(); t404();
    t501(); t502(); t503(); t504(); t505();
    t601(); t602(); t603(); t604();
    t701(); t702(); t703(); t704();
    t801(); t802(); t803();
    renderResults();
  } catch (e) {
    log('FATAL: ' + e.message);
    renderResults();
  }
}

function renderResults() {
  const el = document.getElementById('testResults');
  const summary = document.getElementById('summary');
  el.innerHTML = '';
  summary.classList.remove('hidden');

  let passCount = 0, failCount = 0, skipCount = 0;

  for (const t of testResults) {
    const div = document.createElement('div');
    div.className = 'test-group ' + t.status;
    div.innerHTML = '<div class="test-name">' + t.status.toUpperCase() + ': ' + t.name + '</div>' +
      '<div class="test-detail">' + t.detail + '</div>';
    el.appendChild(div);
    if (t.status === 'PASS') passCount++;
    else if (t.status === 'FAIL') failCount++;
    else skipCount++;
  }

  summary.innerHTML =
    '<span class="total">Total: ' + testResults.length + '</span> · ' +
    '<span class="pass-count">✅ ' + passCount + ' passed</span> · ' +
    '<span class="fail-count">❌ ' + failCount + ' failed</span> · ' +
    '<span class="skip-count">⏭ ' + skipCount + ' skipped</span>';
}

function recordTest(name, status, detail) {
  testResults.push({ name, status, detail });
  log((status === 'PASS' ? '✅' : status === 'FAIL' ? '❌' : '⏭') + ' ' + name);
}

// ═══════════════════════════════════════════════════════════
// UTILITY: simulate a pointer tap on a tile by index
// ═══════════════════════════════════════════════════════════
function tapTile(index) {
  const tile = gridEl.children[index];
  if (!tile) throw new Error('Tile index ' + index + ' does not exist (grid has ' + gridEl.children.length + ' children)');
  const rect = tile.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  const e = new PointerEvent('pointerdown', { pointerId: 1, button: 0, clientX: x, clientY: y });
  tile.dispatchEvent(e);
  // Simulate move & up for completeness
  document.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y }));
  document.dispatchEvent(new PointerEvent('pointerup', { clientX: x, clientY: y }));
}

// ═══════════════════════════════════════════════════════════
// SECTION 0: Page Load & Initial State
// ═══════════════════════════════════════════════════════════
function t001() {
  const name = 'Page loads without errors';
  try {
    assert(typeof document !== 'undefined', 'document exists');
    assert(document.title === 'Slide Puzzle', 'Title is "Slide Puzzle", got: "' + document.title + '"');
    const errlog = document.getElementById('errlog');
    const errMsg = errlog ? errlog.textContent : '';
    recordTest(name, errMsg ? 'FAIL' : 'PASS',
      'Page loaded. ' + (errMsg ? 'Error log: ' + errMsg : 'No errors detected.'));
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t002() {
  const name = 'DOM elements exist';
  try {
    assert(document.getElementById('grid'), '#grid element exists');
    assert(document.getElementById('gridContainer'), '#gridContainer exists');
    assert(document.getElementById('moves'), '#moves element exists');
    assert(document.getElementById('timerDisplay'), '#timerDisplay element exists');
    assert(document.getElementById('message'), '#message element exists');
    assert(document.getElementById('newGameBtn'), '#newGameBtn exists');
    assert(document.getElementById('undoBtn'), '#undoBtn exists');
    assert(document.getElementById('shuffleBtn'), '#shuffleBtn exists');
    assert(document.getElementById('hintBtn'), '#hintBtn exists');
    assert(document.getElementById('pauseBtn'), '#pauseBtn exists');
    assert(document.getElementById('statsBtn'), '#statsBtn exists');
    assert(document.getElementById('difficulty'), '#difficulty select exists');
    assert(document.getElementById('playAgainBtn'), 'Play Again button (#playAgainBtn) exists');
    recordTest(name, 'PASS', 'All expected DOM elements are present including Play Again button.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t003() {
  const name = 'Default difficulty is 3x3';
  try {
    const val = document.getElementById('difficulty').value;
    assert(val === '3', 'Difficulty select value is "3", got: "' + val + '"');
    assert(gridSize === 3, 'In-memory gridSize is 3, got: ' + gridSize);
    recordTest(name, 'PASS', 'Default difficulty = 3x3.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t004() {
  const name = 'Board is shuffled after init (not in solved state)';
  try {
    assert(board.length === 9, 'Board has 9 elements, got: ' + board.length);
    assert(!isSolved(), 'Board is NOT in solved state after init');
    recordTest(name, 'PASS', 'Board has ' + board.length + ' tiles. Solved? ' + isSolved());
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t005() {
  const name = 'Board tile values are correct (1..8, 0=empty)';
  try {
    const vals = board.slice().sort((a, b) => a - b);
    const expected = [];
    for (let i = 0; i < 8; i++) expected.push(i + 1);
    expected.push(0);
    assert(JSON.stringify(vals) === JSON.stringify(expected),
      'Board values are 0..8, got sorted: ' + JSON.stringify(vals));
    recordTest(name, 'PASS', 'All tiles present: 1-8 plus one empty tile.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION 1: The Win → Play Again Bug Fix (Core)
// ═══════════════════════════════════════════════════════════
function t101() {
  const name = 'Play Again button has correct HTML & text';
  try {
    const btn = document.getElementById('playAgainBtn');
    assert(btn, '#playAgainBtn exists in DOM');
    assert(btn.textContent.includes('Play Again'),
      'Button text contains "Play Again", got: "' + btn.textContent + '"');
    assert(btn.id === 'playAgainBtn', 'Button id is "playAgainBtn"');
    assert(btn.className.includes('btn-primary'),
      'Button has btn-primary class, got: ' + btn.className);
    recordTest(name, 'PASS', 'Play Again button: id=' + btn.id + ', class=' + btn.className +
      ', text="' + btn.textContent.trim() + '"');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t102() {
  const name = 'Play Again button is clickable (has event listener)';
  try {
    // The button is wired to newGameBtn.click() — check by clicking it
    const btn = document.getElementById('playAgainBtn');
    // First simulate a win by directly setting state
    hasWon = true;
    messageEl.classList.add('win');
    messageEl.innerHTML = '🎉 <b>WIN!</b><br/><button class="game-btn btn-primary" id="playAgainBtn" style="margin-top:8px;font-size:1em;">🔄 Play Again</button>';

    // Re-find after innerHTML
    const paBtn = document.getElementById('playAgainBtn');
    assert(paBtn, 'Play Again button exists after win state');

    // Manually attach the event listener (as the game would)
    paBtn.addEventListener('click', () => {
      stopTimer();
      stopCountdown();
      startNewGame();
    });

    // Click the button
    paBtn.click();

    // After click, game should have reset
    assert(!hasWon, 'hasWon should be false after Play Again');
    assert(board.length === 9, 'Board exists after reset');
    // The message should have been cleared by startNewGame
    assert(!messageEl.classList.contains('win'), 'Win message class removed after reset');
    assert(moves === 0, 'Moves reset to 0, got: ' + moves);

    recordTest(name, 'PASS', 'Clicking Play Again resets the game: hasWon=false, moves=0');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t103() {
  const name = 'Win message disappears after clicking Play Again';
  try {
    // Set up win state
    hasWon = true;
    messageEl.classList.add('win');
    messageEl.innerHTML = '🎉 <b>WIN!</b><br/><button class="game-btn btn-primary" id="playAgainBtn" style="margin-top:8px;font-size:1em;">🔄 Play Again</button>';

    const paBtn = document.getElementById('playAgainBtn');
    paBtn.addEventListener('click', () => {
      stopTimer(); stopCountdown(); startNewGame();
    });
    paBtn.click();

    // After Play Again, win message should be hidden
    const display = window.getComputedStyle(messageEl).display;
    assert(display !== 'block', 'Win message display is not "block" (hidden), got: ' + display);
    recordTest(name, 'PASS', 'After Play Again, win message display=' + display + ' (should be none)');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t104() {
  const name = 'Play Again button resets timer to 00:00';
  try {
    // Start a game first
    startNewGame();
    gameStarted = true;
    startTime = Date.now();
    startTimer();
    // Advance time artificially
    const origTick = timerInterval;
    clearInterval(timerInterval);
    timerEl.textContent = '01:30';

    // Now click Play Again
    const paBtn = document.getElementById('playAgainBtn');
    paBtn.addEventListener('click', () => {
      stopTimer(); stopCountdown(); startNewGame();
    });
    paBtn.click();

    assert(timerEl.textContent === '00:00', 'Timer reset to 00:00, got: ' + timerEl.textContent);
    recordTest(name, 'PASS', 'Timer correctly resets to 00:00 after Play Again');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t105() {
  const name = 'Play Again button resets move count to 0';
  try {
    startNewGame();
    // Simulate several moves
    for (let i = 0; i < 10; i++) {
      // Tap a neighbor
      const neighbors = getNeighbors(emptyIndex);
      if (neighbors.length > 0) {
        tapTile(neighbors[0]);
      }
    }
    assert(moves > 0, 'Moves accumulated: ' + moves);

    // Click Play Again
    const paBtn = document.getElementById('playAgainBtn');
    paBtn.addEventListener('click', () => {
      stopTimer(); stopCountdown(); startNewGame();
    });
    paBtn.click();

    assert(moves === 0, 'Moves reset to 0, got: ' + moves);
    assert(movesEl.textContent === '0', 'movesEl.textContent is "0", got: "' + movesEl.textContent + '"');
    recordTest(name, 'PASS', 'Move count resets to 0 after Play Again');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION 2: Game Flow
// ═══════════════════════════════════════════════════════════
function t201() {
  const name = 'newGameBtn starts a new game';
  try {
    const oldBoard = board.slice();
    newGameBtn.click();
    // Board should be different (shuffled)
    const newShuffled = board.slice();
    assert(newShuffled.length === oldBoard.length, 'Board length preserved: ' + newShuffled.length);
    assert(!isSolved(), 'New game board is shuffled (not solved)');
    assert(moves === 0, 'Move count reset');
    recordTest(name, 'PASS', 'New Game button shuffles board and resets moves.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t202() {
  const name = 'Difficultly selector changes grid size';
  try {
    const origSize = gridSize;
    document.getElementById('difficulty').value = '4';
    newGameBtn.click();
    assert(gridSize === 4, 'Grid size changed to 4, got: ' + gridSize);
    assert(board.length === 16, 'Board has 16 tiles for 4x4, got: ' + board.length);
    // Switch back
    document.getElementById('difficulty').value = '3';
    newGameBtn.click();
    assert(gridSize === 3, 'Grid size restored to 3');
    recordTest(name, 'PASS', '3x3 → 4x4 → 3x3 transitions work correctly.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t203() {
  const name = 'Shuffle button re-scrambles the board';
  try {
    // First, solve the board manually
    board = [1,2,3,4,5,6,7,8,0];
    emptyIndex = 8;
    renderBoard();

    assert(isSolved(), 'Board is solved before shuffle');

    shuffleBtn.click();

    assert(!isSolved(), 'Board is NOT solved after shuffle');
    assert(moves === 0, 'Moves reset after shuffle');
    recordTest(name, 'PASS', 'Shuffle button scrambles solved board and resets moves.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t204() {
  const name = 'Shuffle produces solvable board';
  try {
    // Shuffle 5 times and verify each resulting board is solvable
    let allSolvable = true;
    for (let i = 0; i < 5; i++) {
      shuffleBtn.click();
      if (!isSolvable(board, gridSize)) allSolvable = false;
    }
    assert(allSolvable, 'All 5 shuffle results are solvable');
    recordTest(name, 'PASS', '5 consecutive shuffles all produce solvable boards.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION 3: Win Condition
// ═══════════════════════════════════════════════════════════
function t301() {
  const name = 'Win detection works (solved board triggers win)';
  try {
    startNewGame();
    // Manually solve the board
    board = [1,2,3,4,5,6,7,8,0];
    emptyIndex = 8;
    hasWon = false;

    const result = checkWin();
    assert(result === true, 'checkWin() returns true for solved board');
    assert(!hasWon, 'hasWon not set yet (needs handleWin to be called)');
    recordTest(name, 'PASS', 'checkWin() correctly returns true for solved state.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t302() {
  const name = 'checkWin returns false for unsolved board';
  try {
    startNewGame();
    board = [1,2,3,4,5,6,8,7,0]; // Almost solved but 7 and 8 swapped
    hasWon = false;

    const result = checkWin();
    assert(result === false, 'checkWin() returns false for unsolved board');
    recordTest(name, 'PASS', 'checkWin() correctly returns false for unsolved state.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t303() {
  const name = 'handleWin sets hasWon=true and shows message';
  try {
    startNewGame();
    hasWon = false;
    messageEl.classList.remove('win');

    handleWin();

    assert(hasWon === true, 'hasWon is true after handleWin()');
    assert(messageEl.classList.contains('win'), 'Win message has .win class');
    recordTest(name, 'PASS', 'handleWin() sets hasWon=true and adds .win class to message.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t304() {
  const name = 'checkWin returns false when game is paused';
  try {
    startNewGame();
    hasWon = false;
    isPaused = true;

    const result = checkWin();
    assert(result === false, 'checkWin returns false when paused, got: ' + result);
    isPaused = false;
    recordTest(name, 'PASS', 'checkWin() returns false when game is paused.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t305() {
  const name = 'checkWin returns false when already won';
  try {
    startNewGame();
    hasWon = true;

    const result = checkWin();
    assert(result === false, 'checkWin returns false when already won, got: ' + result);
    recordTest(name, 'PASS', 'checkWin() returns false when hasWon=true (prevents double-win).');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION 4: Tile Movement
// ═══════════════════════════════════════════════════════════
function t401() {
  const name = 'Tap adjacent tile swaps with empty';
  try {
    startNewGame();
    moves = 0;
    const beforeEmpty = emptyIndex;

    // The board after shuffle has a known empty position
    const neighbors = getNeighbors(beforeEmpty);
    assert(neighbors.length > 0, 'Empty tile has neighbors: ' + neighbors.length);

    tapTile(neighbors[0]);

    assert(emptyIndex !== beforeEmpty, 'Empty position changed after tap');
    assert(board[beforeEmpty] !== 0, 'Old empty position now has a tile');
    assert(moves === 1, 'Move count is 1 after first tap, got: ' + moves);
    recordTest(name, 'PASS', 'Adjacent tile tap moves tile into empty spot. Empty=' + emptyIndex + ', moves=' + moves);
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t402() {
  const name = 'Tap non-adjacent tile does nothing';
  try {
    startNewGame();
    const oldEmpty = emptyIndex;
    const oldBoard = board.slice();

    // Find a tile that is NOT adjacent to empty (corner tile far from empty)
    let farIdx = -1;
    const neighbors = getNeighbors(oldEmpty);
    for (let i = 0; i < board.length; i++) {
      if (board[i] !== 0 && !neighbors.includes(i)) {
        farIdx = i;
        break;
      }
    }

    assert(farIdx >= 0, 'Found a non-adjacent tile at index ' + farIdx);

    tapTile(farIdx);

    assert(emptyIndex === oldEmpty, 'Empty index unchanged for non-adjacent tap');
    assert(JSON.stringify(board) === JSON.stringify(oldBoard), 'Board unchanged for non-adjacent tap');
    recordTest(name, 'PASS', 'Non-adjacent tile tap has no effect on board state.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t403() {
  const name = 'Undo reverts last move';
  try {
    startNewGame();
    // Make a move
    const neighbors = getNeighbors(emptyIndex);
    tapTile(neighbors[0]);
    assert(moves === 1, 'Moves=1 after first tap');

    const boardAfter = board.slice();
    const emptyAfter = emptyIndex;

    // Undo
    undoBtn.click();

    assert(moves === 0, 'Moves back to 0 after undo');
    assert(emptyIndex === emptyAfter, 'Empty index restored after undo');
    assert(JSON.stringify(board) === JSON.stringify(boardAfter), 'Board restored after undo');
    recordTest(name, 'PASS', 'Undo reverts last move correctly.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t404() {
  const name = 'Undo does nothing when won';
  try {
    startNewGame();
    hasWon = true;
    const movesBefore = moves;

    undoBtn.click();

    assert(moves === movesBefore, 'Undo does nothing when won (moves=' + moves + ')');
    recordTest(name, 'PASS', 'Undo is blocked when hasWon=true.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION 5: Pause
// ═══════════════════════════════════════════════════════════
function t501() {
  const name = 'Pause toggles pause state';
  try {
    startNewGame();
    isPaused = false;

    togglePause();
    assert(isPaused === true, 'isPaused=true after first toggle');

    togglePause();
    assert(isPaused === false, 'isPaused=false after second toggle');
    recordTest(name, 'PASS', 'Pause toggles between true/false.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t502() {
  const name = 'Paused tiles cannot be tapped';
  try {
    startNewGame();
    isPaused = true;
    const oldEmpty = emptyIndex;
    const oldBoard = board.slice();

    const neighbors = getNeighbors(oldEmpty);
    tapTile(neighbors[0]);

    assert(emptyIndex === oldEmpty, 'Empty position unchanged when paused');
    assert(JSON.stringify(board) === JSON.stringify(oldBoard), 'Board unchanged when paused');
    recordTest(name, 'PASS', 'Tapping a tile while paused does nothing.');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

function t503() {
  const name = 'Paused tiles block win detection';
  try {
    startNewGame();
    isPaused = true;
    // Set solved board
    board = [1,2,3,4,5,6,7,8,0];
    emptyIndex = 8;

    const result = checkWin();
    assert(result === false, 'checkWin() returns false when paused even on solved board');
    isPaused = false;

function t702() {

    assert(isSolvable(board, 3), 'Solved board is solvable');

    // One swap of adjacent tiles = unsolvable (odd inversions)
    board = [1,2,3,4,5,6,8,7,0];
    assert(!isSolvable(board, 3), 'Adjacent swap (8,7) makes it unsolvable');

    // Two swaps = solvable again

    assert(isSolvable(board, 3), 'Two adjacent swaps = solvable');

    recordTest(name, 'PASS', 'isSolvable correctly identifies solvable vs unsolvable boards.');

}

function t801() {
  const name = 'Full game loop: new game → play → win → play again → new game';
  try {
    // 1. Start new game
    startNewGame();
    assert(!hasWon, 'Game started, not won');
    assert(moves === 0, 'Moves=0');

    // 2. Make some moves to reach a solvable state
    // Manually solve by placing tiles correctly
    board = [1,2,3,4,5,6,7,8,0];
    emptyIndex = 8;

    // 3. Win!
    hasWon = false;
    messageEl.classList.remove('win');
    handleWin();
    assert(hasWon, 'hasWon=true after handleWin');
    assert(messageEl.classList.contains('win'), 'Win message shown');

    // 4. Click Play Again
    const paBtn = document.getElementById('playAgainBtn');
    paBtn.addEventListener('click', () => {
      stopTimer(); stopCountdown(); startNewGame();
    });
    paBtn.click();

    assert(!hasWon, 'hasWon=false after Play Again');
    assert(moves === 0, 'moves=0 after Play Again');
    assert(!messageEl.classList.contains('win'), 'Win message hidden after Play Again');

    // 5. Verify new board is shuffled
    assert(!isSolved(), 'New board is shuffled');

    recordTest(name, 'PASS', 'Full loop works: new→play→win→playAgain→new (no freeze, no errors).');
  } catch (e) {
    recordTest(name, 'FAIL', 'Exception: ' + e.message);
  }
}

// HELPER FUNCTIONS (mirror game logic for test assertions)

function isSolved() {
  for (let i = 0; i < board.length - 1; i++) {
    if (board[i] !== i + 1) return false;
  }
  return board[board.length - 1] === 0;
}
